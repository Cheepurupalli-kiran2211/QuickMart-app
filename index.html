<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER / NAVBAR -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #1a1a1a; color: white; position: sticky; top: 0; z-index: 100;">
        <h1 style="margin: 0; color: #2ec4b6;">QuickMart</h1>
        
       
<div style="position: relative; display: inline-block;">
    <input type="text" id="search" placeholder="Search products..." style="padding: 10px 40px 10px 15px; width: 300px; border-radius: 25px; border: 1px solid #ccc !important; outline: none; background: #ffffff !important; color: #000000 !important; font-size: 14px; font-weight: 500;">
    <span style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #2ec4b6; font-size: 16px; pointer-events: none; font-weight: bold;">🔍</span>
</div>
        
        <div style="display: flex; align-items: center; gap: 10px;">
            <!-- WISHLIST VIEW BUTTON -->
            <button id="wishlist-view-btn" style="background: #ff4d4d; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                ❤️ Wishlist (<span id="wishlist-count">0</span>)
            </button>

            <!-- CHECKOUT CART BUTTON -->
            <button id="checkout-btn" style="background: #2ec4b6; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                🛒 Cart (<span id="cart-count">0</span>) Total: ₹<span id="total-price">0</span>
            </button>

            <button id="theme-toggle" style="background: #ffb703; color: #1a1a1a; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">🌙 Dark Mode</button>
        </div>
    </header>

    <!-- CATEGORIES -->
    <div class="categories" style="display: flex; justify-content: center; gap: 15px; margin: 25px 0;">
        <button data-filter="all" class="active">All</button>
        <button data-filter="fruits">🍎 Fruits</button>
        <button data-filter="dairy">🥛 Dairy</button>
        <button data-filter="drinks">🍹 Drinks</button>
        <button data-filter="snacks">🍪 Snacks</button>
    </div>

    <!-- PRODUCTS CONTAINER -->
    <section class="products" id="products-container"></section>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1100; display: flex; flex-direction: column; gap: 10px;"></div>

    <!-- ==========================================================================
         MODALS (నీ పాత మోడల్ పక్కా స్ట్రక్చర్ ని తిరిగి తెచ్చాను బ్రో)
         ========================================================================== -->

    <!-- 1. CART CHECKOUT MODAL -->
    <div id="checkout-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Order Summary 📄</h2>
            <hr style="margin: 10px 0; border: 1px solid #eee;">
            
            <!-- కార్ట్ ఐటమ్స్ కనిపించే లిస్ట్ బాక్స్ -->
            <div id="cart-items-list" style="max-height: 180px; overflow-y: auto; margin-bottom: 15px; text-align: left; padding: 5px;"></div>

            <p>Total Items: <span id="modal-count">0</span></p>
            <p>Final Bill: <strong style="color: green;">₹<span id="modal-total">0</span></strong></p>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">📍 Delivery Location Selected</p>
            
            <div class="modal-buttons">
                <button id="place-order-btn">Confirm & Place Order</button>
                <button id="close-modal-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- 2. WISHLIST POPUP MODAL (ఇది కూడా నీ పాత డిజైన్ బాక్స్ లోనే వస్తుంది) -->
    <div id="wishlist-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>My Wishlist ❤️</h2>
            <hr style="margin: 10px 0; border: 1px solid #eee;">
            
            <!-- విష్‌లిస్ట్ ఐటమ్స్ ఇక్కడ కనిపిస్తాయి బ్రో -->
            <div id="wishlist-items-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px; text-align: left; padding: 5px;"></div>
            
            <div class="modal-buttons">
                <button id="close-wishlist-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
