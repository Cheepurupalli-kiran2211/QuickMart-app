<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛒 QuickMart (Cart: <span id="cart-count">0</span>)</h1>
        <p>Total: ₹<span id="total-price">0</span></p>
        <p>Delivery in Minutes</p>
        <button id="checkout-btn" class="checkout-main-btn">Proceed to Checkout ➔</button>
    </header>

    <div class="banner">
         🎉 Flat 50% Off on First Order
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="search products...">
    </div>

    <div class="categories">
        <button data-filter="all" class="active">All</button>
        <button data-filter="fruits">🍎 Fruits</button>
        <button data-filter="dairy">🥛 Dairy</button>
        <button data-filter="drinks">🥤 Drinks</button>
        <button data-filter="snacks">🍪 Snacks</button>
    </div>

    <section class="products" id="products-container"></section>

    <div id="checkout-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Order Summary 📝</h2>
            <hr style="margin: 10px 0; border: 1px solid #eee;">
            <p>Total Items: <span id="modal-count">0</span></p>
            <p>Final Bill: <strong style="color: green;">₹<span id="modal-total">0</span></strong></p>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">📍 Delivery Location: Home (Saved Address)</p>
            <div class="modal-buttons">
                <button id="place-order-btn">Confirm & Place Order</button>
                <button id="close-modal-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
